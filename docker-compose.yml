name: bengaltex-erp

# Bengal TEX ERP — full stack (SQL Server + .NET API + Angular/nginx).
# Copy .env.example → .env and fill in the secrets before `docker compose up -d --build`.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express          # free, production-licensed (10 GB cap). Use Standard for larger data.
    ports:
      - "1433:1433"               # exposed for admin/backup tools; remove to keep DB internal-only
    volumes:
      - mssql-data:/var/opt/mssql
      - db-backups:/var/opt/mssql/backups   # nightly .bak files land here (shared with api for cleanup)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/BengalTex.ERP.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      # Self-initialize the DB on first boot: apply EF migrations + seed (SuperAdmin, roles,
      # permissions, base currency, numbering series). Idempotent — safe on every start.
      Database__InitializeOnStartup: "true"
      # App + Hangfire share one database (Hangfire uses its own [HangFire] schema).
      ConnectionStrings__DefaultConnection: "Server=db;Database=BengalTexERP;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      ConnectionStrings__HangfireConnection: "Server=db;Database=BengalTexERP;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET}
      DeviceFingerprint__Salt: ${FINGERPRINT_SALT}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
      # Nightly DB backup: SQL writes to its own path; the api cleans up via the shared volume.
      DatabaseBackup__BackupDirectory: "/var/opt/mssql/backups"
      DatabaseBackup__CleanupDirectory: "/backups"
    volumes:
      - api-uploads:/app/uploads     # attachment files persist here
      - api-logs:/app/logs
      - db-backups:/backups          # same volume as db:/var/opt/mssql/backups (retention cleanup)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./client
    ports:
      - "${WEB_PORT:-8088}:80"       # browse the app at http://<server>:8088
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql-data:
  api-uploads:
  api-logs:
  db-backups:
