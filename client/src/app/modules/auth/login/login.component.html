<div class="login-wrapper">
  <div class="login-lang"><app-lang-toggle></app-lang-toggle></div>
  <div class="login-container">

    <!-- Logo / Brand -->
    <div class="brand">
      <div class="brand-icon">
        <img *ngIf="logoOk" [src]="companyLogoUrl" class="brand-logo-img" alt="Company logo" (error)="logoOk = false" />
        <i *ngIf="!logoOk" class="pi pi-building"></i>
      </div>
      <h1 class="brand-name">Bengal TEX ERP</h1>
      <p class="brand-tagline">{{ 'login.tagline' | t }}</p>
    </div>

    <!-- Login Card -->
    <p-card styleClass="login-card">
      <ng-template pTemplate="title">
        <span class="card-title">{{ 'login.title' | t }}</span>
      </ng-template>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="on">

        <!-- Email / Username -->
        <div class="field">
          <label for="emailOrUsername">{{ 'login.userLabel' | t }}</label>
          <input
            pInputText
            id="emailOrUsername"
            formControlName="emailOrUsername"
            placeholder="admin@bengaltex.com"
            autocomplete="username"
            class="w-full"
          />
          <small
            class="p-error"
            *ngIf="loginForm.get('emailOrUsername')?.invalid && loginForm.get('emailOrUsername')?.touched">
            {{ 'login.userRequired' | t }}
          </small>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">{{ 'login.password' | t }}</label>
          <p-password
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            [placeholder]="'login.passwordPlaceholder' | t"
            autocomplete="current-password"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <small
            class="p-error"
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{ 'login.passwordRequired' | t }}
          </small>
        </div>

        <!-- Error message -->
        <div class="error-alert" *ngIf="errorMessage">
          <i class="pi pi-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Submit button -->
        <p-button
          type="submit"
          [label]="'login.signIn' | t"
          icon="pi pi-sign-in"
          [loading]="loading"
          [disabled]="loginForm.invalid || loading"
          styleClass="w-full login-btn"
        />

        <!-- Forgot password link -->
        <div class="forgot-link">
          <a routerLink="/login/forgot-password">{{ 'login.forgot' | t }}</a>
        </div>

      </form>
    </p-card>

    <p class="footer-note">Bengal TEX ERP v1.0 &copy; 2026</p>
  </div>
</div>
