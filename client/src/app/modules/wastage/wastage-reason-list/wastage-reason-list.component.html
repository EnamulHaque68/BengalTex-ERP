<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="page-title">Wastage Reasons</h2>
      <p class="page-subtitle">Reason codes for wastage entries — reusable (recoverable) vs non-reusable loss</p>
    </div>
    <div class="header-actions">
      <a routerLink="/wastage" class="link-btn"><i class="pi pi-arrow-left"></i> Wastage</a>
      <label class="toggle"><p-checkbox [(ngModel)]="includeInactive" [binary]="true" (onChange)="load()" /> Inactive</label>
      <p-button *ngIf="canManage" label="Add Reason" icon="pi pi-plus" (click)="openCreate()" />
    </div>
  </div>

  <p-card styleClass="table-card">
    <p-table [value]="reasons" [loading]="loading" [rowHover]="true" styleClass="p-datatable-sm">
      <ng-template pTemplate="header"><tr><th>Name</th><th>Reusable</th><th>Active</th><th>Description</th><th style="width:90px"></th></tr></ng-template>
      <ng-template pTemplate="body" let-r>
        <tr>
          <td class="fw-600">{{ r.name }}</td>
          <td><span class="badge" [class.yes]="r.isReusable" [class.no]="!r.isReusable">{{ r.isReusable ? 'Reusable' : 'Loss' }}</span></td>
          <td><i class="pi" [class.pi-check]="r.isActive" [class.pi-times]="!r.isActive" [class.ok]="r.isActive" [class.off]="!r.isActive"></i></td>
          <td class="muted">{{ r.description || '—' }}</td>
          <td>
            <div class="row-actions" *ngIf="canManage">
              <p-button icon="pi pi-pencil" severity="secondary" [text]="true" size="small" (click)="openEdit(r)" />
              <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small" (click)="confirmDelete(r)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage"><tr><td colspan="5" class="empty-row"><i class="pi pi-tags"></i><span>No reasons.</span></td></tr></ng-template>
    </p-table>
  </p-card>
</div>

<p-dialog [(visible)]="dialogVisible" [header]="dialogMode==='create' ? 'Add Reason' : 'Edit Reason'" [modal]="true" [style]="{ width: '480px' }">
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="alert alert-error" *ngIf="dialogError"><i class="pi pi-exclamation-circle"></i>{{ dialogError }}</div>
    <div class="dialog-grid">
      <div class="field col-span-2"><label>Name *</label><input pInputText formControlName="name" class="w-full" /></div>
      <div class="field check-field"><label>Reusable (recoverable)</label><p-checkbox formControlName="isReusable" [binary]="true" /></div>
      <div class="field check-field" *ngIf="dialogMode==='edit'"><label>Active</label><p-checkbox formControlName="isActive" [binary]="true" /></div>
      <div class="field col-span-2"><label>Description</label><input pInputText formControlName="description" class="w-full" /></div>
    </div>
    <div class="dialog-footer">
      <p-button label="Cancel" severity="secondary" [text]="true" (click)="dialogVisible=false" [disabled]="dialogSaving" />
      <p-button type="submit" [label]="dialogSaving ? 'Saving...' : 'Save'" icon="pi pi-save" [loading]="dialogSaving" [disabled]="form.invalid || dialogSaving" />
    </div>
  </form>
</p-dialog>

<p-dialog [(visible)]="deleteDialogVisible" header="Delete Reason" [modal]="true" [style]="{ width: '420px' }">
  <div *ngIf="deleting">
    <p>Delete <strong>{{ deleting.name }}</strong>?</p>
    <div class="alert alert-error" *ngIf="deleteError"><i class="pi pi-exclamation-circle"></i>{{ deleteError }}</div>
    <div class="dialog-footer">
      <p-button label="Cancel" severity="secondary" [text]="true" (click)="deleteDialogVisible=false" [disabled]="deleteBusy" />
      <p-button label="Delete" icon="pi pi-trash" severity="danger" [loading]="deleteBusy" (click)="doDelete()" />
    </div>
  </div>
</p-dialog>
