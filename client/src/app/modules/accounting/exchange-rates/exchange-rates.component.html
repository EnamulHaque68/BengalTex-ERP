<div class="page-shell">
  <div class="page-header">
    <div>
      <h2 class="page-title">Exchange Rates</h2>
      <p class="page-subtitle">Dated FX rate history &mdash; the source for as-of rate resolution &amp; month-end revaluation</p>
    </div>
    <div class="header-actions">
      <p-button label="Add Rate" icon="pi pi-plus" *ngIf="canManage" (click)="openCreate()" />
    </div>
  </div>

  <div class="alert alert-ok page-alert" *ngIf="actionMessage">
    <i class="pi pi-check-circle"></i>{{ actionMessage }}
    <button type="button" class="alert-close" (click)="actionMessage = ''">&times;</button>
  </div>

  <p-card styleClass="table-card">
    <div class="filter-row">
      <p-select [(ngModel)]="filterCurrencyId" [options]="currencies" optionLabel="code" optionValue="id"
                [showClear]="true" placeholder="All currencies" (onChange)="load()" styleClass="filter-select-sm" />
    </div>
    <p-table [value]="rates" [loading]="loading" [rowHover]="true" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr><th>Currency</th><th>Date</th><th class="num">Rate (BDT)</th><th>Source</th></tr>
      </ng-template>
      <ng-template pTemplate="body" let-r>
        <tr>
          <td class="fw-600">{{ r.currencyCode }}</td>
          <td>{{ r.rateDate }}</td>
          <td class="num fw-700">{{ r.rate | number:'1.2-6' }}</td>
          <td>{{ r.source || '—' }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="4" class="empty-row"><i class="pi pi-dollar"></i> No dated rates yet.</td></tr>
      </ng-template>
    </p-table>
  </p-card>
</div>

<p-dialog [(visible)]="dialogVisible" header="Add Exchange Rate" [modal]="true" [style]="{ width: '440px' }" [draggable]="false">
  <div class="alert alert-error" *ngIf="dialogError"><i class="pi pi-exclamation-circle"></i>{{ dialogError }}</div>
  <div class="dlg-grid">
    <div class="field col-span-2">
      <label>Currency *</label>
      <p-select [(ngModel)]="currencyId" [options]="currencies" optionLabel="code" optionValue="id" appendTo="body" class="w-full" styleClass="w-full" />
    </div>
    <div class="field">
      <label>Date *</label>
      <input pInputText type="date" [(ngModel)]="rateDate" class="w-full" />
    </div>
    <div class="field">
      <label>Rate (BDT per unit) *</label>
      <p-inputNumber [(ngModel)]="rate" [min]="0" [maxFractionDigits]="6" class="w-full" styleClass="w-full" inputStyleClass="w-full" />
    </div>
    <div class="field col-span-2">
      <label>Source</label>
      <input pInputText [(ngModel)]="source" placeholder="e.g. BB mid-rate / bank TT" class="w-full" />
    </div>
  </div>
  <div class="dialog-footer">
    <p-button label="Cancel" severity="secondary" [text]="true" (click)="dialogVisible = false" [disabled]="saving" />
    <p-button label="Save" icon="pi pi-save" [loading]="saving" [disabled]="!currencyId || rate <= 0" (click)="save()" />
  </div>
</p-dialog>
