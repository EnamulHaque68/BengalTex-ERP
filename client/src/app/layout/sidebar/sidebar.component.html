<nav class="sb-nav" [class.collapsed]="collapsed">

  <!-- Menu search (Phase 4) — hidden in collapsed rail -->
  <div class="sb-search" *ngIf="!collapsed">
    <i class="pi pi-search sb-search-icon"></i>
    <input type="text" class="sb-search-input" placeholder="Search menu…"
           [(ngModel)]="searchTerm" autocomplete="off" />
    <button type="button" class="sb-search-clear" *ngIf="isSearching" (click)="clearSearch()" aria-label="Clear">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- Search results -->
  <ul class="sb-list sb-results" *ngIf="isSearching && !collapsed">
    <li *ngFor="let r of searchResults" class="sb-subitem">
      <a class="sb-sublink" [class.active]="currentUrl === r.route || currentUrl.startsWith(r.route + '/')"
         [routerLink]="r.route" (click)="clearSearch()">
        <i class="sb-subicon" [ngClass]="r.icon || 'pi pi-angle-right'"></i>
        <span class="sb-text">{{ r.title }}</span>
        <span class="sb-crumb" *ngIf="r.breadcrumb">{{ r.breadcrumb }}</span>
      </a>
    </li>
    <li *ngIf="!searchResults.length" class="sb-noresults">No menu items match.</li>
  </ul>

  <!-- Full menu tree (hidden while searching) -->
  <ul class="sb-list" *ngIf="!isSearching">
    <ng-container *ngFor="let item of menu; trackBy: trackByTitle">
      <li *ngIf="isVisible(item)" class="sb-item"
          [class.is-group]="item.children?.length"
          [class.open]="isOpen(item)">

        <!-- Leaf (no children) -->
        <a *ngIf="!item.children?.length"
           class="sb-link"
           [class.active]="isLeafActive(item)"
           [routerLink]="item.route"
           [pTooltip]="collapsed ? item.title : ''" tooltipPosition="right">
          <i class="sb-icon" [ngClass]="item.icon || 'pi pi-circle'"></i>
          <span class="sb-text">{{ item.title }}</span>
        </a>

        <!-- Group header (has children) -->
        <ng-container *ngIf="item.children?.length">
          <button type="button" class="sb-link sb-group-header"
                  [class.active]="isGroupActive(item)"
                  (click)="toggleGroup(item)"
                  [pTooltip]="collapsed ? item.title : ''" tooltipPosition="right">
            <i class="sb-icon" [ngClass]="item.icon || 'pi pi-folder'"></i>
            <span class="sb-text">{{ item.title }}</span>
            <i class="sb-caret pi" [ngClass]="isOpen(item) ? 'pi-chevron-down' : 'pi-chevron-right'"></i>
          </button>

          <!-- Children -->
          <ul class="sb-sublist" *ngIf="isOpen(item) && !collapsed">
            <ng-container *ngFor="let child of item.children; trackBy: trackByTitle">
              <li *ngIf="isLeafVisible(child)" class="sb-subitem">
                <a class="sb-sublink"
                   [class.active]="isLeafActive(child)"
                   [routerLink]="child.route">
                  <i class="sb-subicon" [ngClass]="child.icon || 'pi pi-angle-right'"></i>
                  <span class="sb-text">{{ child.title }}</span>
                </a>
              </li>
            </ng-container>
          </ul>
        </ng-container>
      </li>
    </ng-container>
  </ul>
</nav>
