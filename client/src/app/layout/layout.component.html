<div class="layout" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">

  <!-- Sidebar -->
  <aside class="layout-sidebar">
    <div class="brand">
      <img *ngIf="logoOk" [src]="companyLogoUrl" class="brand-logo" alt="Company logo" (error)="logoOk = false" />
      <i *ngIf="!logoOk" class="pi pi-bolt brand-mark"></i>
      <span class="brand-text" *ngIf="!collapsed">Bengal TEX <span class="brand-erp">ERP</span></span>
    </div>
    <app-sidebar [collapsed]="collapsed"></app-sidebar>
  </aside>

  <!-- Backdrop for mobile off-canvas -->
  <div class="layout-backdrop" (click)="closeMobile()"></div>

  <!-- Main column -->
  <div class="layout-main">
    <header class="topbar">
      <div class="topbar-left">
        <!-- desktop collapse -->
        <button type="button" class="icon-btn collapse-btn" (click)="toggleCollapse()" pTooltip="Toggle menu" tooltipPosition="bottom">
          <i class="pi pi-bars"></i>
        </button>
        <!-- mobile hamburger -->
        <button type="button" class="icon-btn mobile-btn" (click)="toggleMobile()">
          <i class="pi pi-bars"></i>
        </button>
      </div>

      <div class="topbar-right">
        <button type="button" class="icon-btn" (click)="toggleTheme()" [pTooltip]="theme === 'dark' ? 'Light mode' : 'Dark mode'" tooltipPosition="bottom">
          <i class="pi" [ngClass]="theme === 'dark' ? 'pi-sun' : 'pi-moon'"></i>
        </button>
        <a routerLink="/notifications" class="icon-btn" pTooltip="Notifications" tooltipPosition="bottom">
          <i class="pi pi-bell"></i>
        </a>
        <div class="topbar-user">
          <button type="button" class="user-trigger" (click)="toggleUserMenu()" [class.open]="userMenuOpen">
            <span class="avatar">
              <img *ngIf="avatarUrl" [src]="avatarUrl" alt="" />
              <span *ngIf="!avatarUrl" class="avatar-initials">{{ initials }}</span>
            </span>
            <span class="user-meta">
              <span class="user-name">{{ userName }}</span>
              <span class="user-role" *ngIf="userRole">{{ userRole }}</span>
            </span>
            <i class="pi pi-chevron-down user-caret"></i>
          </button>

          <!-- dropdown -->
          <div class="user-backdrop" *ngIf="userMenuOpen" (click)="closeUserMenu()"></div>
          <div class="user-pop" *ngIf="userMenuOpen">
            <div class="up-head">
              <span class="up-avatar">
                <img *ngIf="avatarUrl" [src]="avatarUrl" alt="" />
                <span *ngIf="!avatarUrl" class="avatar-initials lg">{{ initials }}</span>
              </span>
              <span class="up-name">{{ userName }}</span>
              <span class="up-role" *ngIf="userRole">{{ userRole }}</span>
            </div>
            <div class="up-divider"></div>
            <button type="button" class="up-logout" (click)="closeUserMenu(); logout()">
              <i class="pi pi-sign-out"></i> Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="layout-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
